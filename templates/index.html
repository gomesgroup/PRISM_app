<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Heatmap</title>
    <!-- Plotly.js - Using specific version to avoid deprecated latest warning -->
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            font-family: Arial, sans-serif;
        }
        #heatmap {
            width: 100vw;
            height: 100vh;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Loading heatmap...</div>
    <div id="heatmap" style="display: none;"></div>

    <script>
        // Load and display heatmap
        fetch('/api/heatmap-data')
            .then(response => response.json())
            .then(data => {
                // Parse the JSON data
                const plotData = JSON.parse(data);
                
                // Update layout for full screen
                plotData.layout.width = null;
                plotData.layout.height = null;
                plotData.layout.margin = {l: 150, r: 50, t: 80, b: 100};
                
                // Hide loading and show heatmap
                document.getElementById('loading').style.display = 'none';
                document.getElementById('heatmap').style.display = 'block';
                
                // Create the plot
                Plotly.newPlot('heatmap', plotData.data, plotData.layout, {
                    responsive: true,
                    displayModeBar: true,
                    modeBarButtonsToRemove: ['pan2d', 'select2d', 'lasso2d', 'autoScale2d'],
                    displaylogo: false
                });
            })
            .catch(error => {
                console.error('Error fetching heatmap data:', error);
                document.getElementById('loading').innerHTML = 'Error loading heatmap: ' + error.message;
            });
    </script>
</body>
</html>
