<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amide Coupling Data Explorer</title>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <!-- RDKit.js for molecular structure rendering -->
    <script src="https://unpkg.com/@rdkit/rdkit/dist/RDKit_minimal.js"></script>
    <style>

        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Avenir', 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            position: relative;
            overflow-x: hidden;  /* Disable horizontal scrolling */
            overflow-y: auto;    /* Allow vertical scrolling */
        }

        /* Game of Life Background */
        .game-of-life-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .grid-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        .grid {
            display: grid;
            gap: 12px;
            transform: scale(1);
            position: relative;
            z-index: 0;
            will-change: transform;
            opacity: 0.5;
        }

        .grid-row {
            display: flex;
            gap: 16px;
        }

        .cell {
            transition: background-color 1200ms ease-in-out;
            will-change: background-color;
            border-radius: 2px;
            width: 80px;
            height: 80px;
        }

        /* Very Large Screens (Desktop monitors) */
        @media (min-width: 2560px) {
            .title {
                font-size: 4.5rem;
                font-weight: 800;
            }

            .subtitle {
                font-size: 1.5rem;
                font-weight: 300;
            }

            .header-container {
                padding: 2rem 0;
            }

            .content-container {
                margin-top: 140px;
                padding: 0px;
                width: 100vw;
                overflow-x: hidden;
                display: flex;
                justify-content: flex-start;
            }

            .sidebar {
                width: 500px;
                height: 700px;
            }

            #heatmap {
                width: calc(100vw - 555px);  /* Viewport width minus larger sidebar and margins */
                height: 960px;
                max-width: 1200px;
                min-width: 800px;
            }

            .cell {
                width: 80px !important;
                height: 80px !important;
            }
            
            .grid-row {
                gap: 16px;
            }

            .grid {
                gap: 12px;
            }
        }

        /* Header Styles */
        .header-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            text-align: center;
            padding: 1.5rem 0;
            width: 100%;
            animation: fadeIn 1.2s ease-out forwards;
            transition: transform 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.9) 50%, rgba(255, 255, 255, 0) 100%);
        }

        .title-wrapper {
            display: flex;
            align-items: center;

            padding-bottom: 1rem;

        .title {
            font-family: 'Avenir', 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;

        .subtitle-wrapper {

            font-size: 1.3rem;

            white-space: nowrap;
        }

        .subtitle:first-child {
            font-weight: 300;
        }

        .subtitle:last-child {
            font-weight: 300;
        }

        /* Content Container */
        .content-container {
            position: relative;
            z-index: 50;
            margin-top: 120px;
            padding: 0px;
            background: transparent;
            width: 100vw; /* Use full viewport width */
            overflow-x: hidden;   /* Disable horizontal scrolling */
            display: grid;
            grid-template-columns: 440px 1fr 20px; /* Sidebar area (540px - 100px overlap), heatmap space, right margin */
            grid-template-areas: "sidebar heatmap .";
            align-items: start;
            box-sizing: border-box;
        }

        /* Sidebar */
        .sidebar {
            grid-area: sidebar;
            width: 500px;
            height: 600px;
            background: white;
            border: 2px solid black;
            border-radius: 12px;
            margin-left: 20px; /* Keep original positioning within grid area */
            justify-self: start;
            position: relative; /* Needed for pseudo-element positioning */
        }

        /* Sidebar shadow effect */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 10px;    /* Offset 10px down */
            left: 10px;   /* Offset 10px to the right */
            width: 500px;
            height: 600px;
            background-color: #C0C0C0;
            border-radius: 12px;
            z-index: -1;  /* Behind the sidebar */
        }

        /* Heatmap Wrapper */
        .heatmap-wrapper {
            grid-area: heatmap;
            position: relative;
            justify-self: start;
        }

        #heatmap {
            width: calc(100vw - 460px);  /* Viewport width minus sidebar area and right margin */
            height: 830px;   /* Fixed height for larger heatmap */
            margin: 0;
            max-width: 1020px; /* Maximum size */
            min-width: 600px;  /* Minimum usable size */
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #666;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        /* Molecule tooltip styles */
        .molecule-tooltip {
            position: absolute;
            background: white;
            border: 2px solid #333;
            border-radius: 4px;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
            pointer-events: none;
            max-width: 140px;
        }
        
        .molecule-tooltip .title {
            font-weight: bold;
            margin-bottom: 4px;
            color: #333;
            text-align: center;
            font-size: 12px;
        }
        
        .molecule-tooltip .structure {
            text-align: center;
            margin-bottom: 3px;
        }
        
        .molecule-tooltip .structure img {
            max-width: 120px;
            height: auto;
            border-radius: 3px;
        }
        
        .molecule-tooltip .smiles {
            font-size: 10px;
            color: #666;
            word-break: break-all;
            text-align: center;
        }
        
        .loading-structure {
            color: #999;
            padding: 6px;
            text-align: center;
            font-size: 10px;
        }

        /* Heatmap highlight overlays */
        .highlight-overlay {
            position: absolute;
            pointer-events: none;
            border: 3px solid white;
            box-sizing: border-box;
            z-index: 100;
            opacity: 0.8;
        }
        
        /* Ensure axis labels can receive mouse events */
        .xtick text, .ytick text {
            pointer-events: all !important;
            cursor: pointer !important;
        }
        
        /* Hover effect for axis labels */
        .xtick text:hover, .ytick text:hover {
            fill: #007acc !important;
            font-weight: bold !important;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInLeft {
            from { 
                opacity: 0;
                transform: translateX(-50px);
            }
            to { 
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from { 
                opacity: 0;
                transform: translateX(50px);
            }
            to { 
                opacity: 1;
                transform: translateX(0);
            }
        }



        /* Small Laptop Screens */
        @media (max-width: 1024px) {
            .title {
                font-size: 3rem;
                font-weight: 800;
                padding-right: 1rem;
            }

            .subtitle {
                font-size: 1.2rem;
                font-weight: 300;
            }

            .content-container {
                margin-top: 110px;
                padding: 0px;
                width: 100vw;
                overflow-x: hidden;
                display: grid;
                grid-template-columns: 340px 1fr 20px; /* Smaller sidebar area for small laptops */
                grid-template-areas: "sidebar heatmap .";
                align-items: start;
            }

            .sidebar {
                width: 300px;
                height: 500px;
            }

            .sidebar::before {
                width: 300px;
                height: 500px;
            }

            #heatmap {
                width: calc(100vw - 355px);  /* Viewport width minus smaller sidebar and margins */
                height: 720px;
                max-width: 900px;
                min-width: 500px;
            }

            .cell {
                width: 50px !important;
                height: 50px !important;
            }

            .grid {
                gap: 6px;
            }

            .grid-row {
                gap: 8px;
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .title-wrapper {
                flex-direction: row;  /* Keep side by side on mobile too */
                align-items: center;
                justify-content: center;
            }

            .title {
                font-size: 2.5rem;
                font-weight: 800;
                padding-right: 1rem;
                text-align: right;
            }

            .subtitle-wrapper {
                border-left: 2px solid rgba(0, 0, 0, 0.2);
                padding-left: 1rem;
                margin-left: 0;
                align-items: flex-start;
                text-align: left;
            }

            .subtitle {
                font-size: 1.1rem;
                font-weight: 300;
            }

            .content-container {
                margin-top: 130px;
                padding: 0px;
                width: 100vw;
                overflow-x: hidden;
                display: grid;
                grid-template-columns: 1fr; /* Single column for mobile */
                grid-template-areas: 
                    "sidebar"
                    "heatmap";
                justify-items: center;
                gap: 20px;
            }

            .sidebar {
                width: 90%;
                height: 200px;
                margin-left: 0; /* Reset margins for mobile grid */
                justify-self: center;
            }

            .sidebar::before {
                width: 90%;
                height: 200px;
            }

            .heatmap-wrapper {
                width: 100%;
                justify-self: center;
            }

            #heatmap {
                width: 90vw;   /* Use 90% of viewport on mobile */
                height: 640px;
                max-width: 800px;
                min-width: 300px;
            }

            .cell {
                width: 40px !important;
                height: 40px !important;
            }

            .grid {
                gap: 4px;
            }

            .grid-row {
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <!-- Game of Life Background -->
    <div class="game-of-life-container">
        <div class="grid-container">
            <div class="grid" id="gameGrid">
                <!-- Grid cells will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="header-container">
        <div class="title-wrapper">
            <h1 class="title">Data</h1>
            <div class="subtitle-wrapper">
                <h2 class="subtitle">Explore the space of</h2>
                <h2 class="subtitle">amide coupling reactions</h2>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="content-container">
        <div class="sidebar">
            <!-- Sidebar content will go here -->
        </div>
        <div class="heatmap-wrapper">
    <div id="loading" class="loading">Loading heatmap...</div>
    <div id="heatmap" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Game of Life Implementation
        class GameOfLife {
            constructor() {
                this.GRID_SIZE = this.getGridSize();
                this.grid = [];
                this.isVisible = true;
                this.animationId = null;
                this.lastUpdate = 0;
                this.rules = { survive: [2, 3], birth: [3, 6] }; // highlife rules
                
                this.initializeGrid();
                this.setupIntersectionObserver();
                this.startAnimation();
            }

            getGridSize() {
                const width = window.innerWidth;
                if (width <= 768) return 10;      // Mobile
                if (width <= 1024) return 12;     // Small laptop
                if (width >= 2560) return 16;     // Very large screens
                return 14;                         // Standard laptop/desktop
            }

            createCell(active) {
                return {
                    active: active,
                    intensity: active ? 0.7 : 0,
                    age: 0,
                    energy: Math.random() * 0.7
                };
            }

            initializeGrid() {
                const density = 0.4;
                this.grid = Array(this.GRID_SIZE).fill(null).map(() => 
                    Array(this.GRID_SIZE).fill(null).map(() => 
                        this.createCell(Math.random() < density)
                    )
                );
                this.renderGrid();
            }

            setupIntersectionObserver() {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        this.isVisible = entry.isIntersecting;
                    },
                    { threshold: 0.1 }
                );

                const container = document.querySelector('.game-of-life-container');
                if (container) {
                    observer.observe(container);
                }
            }

            getNeighbors(x, y) {
                let count = 0;
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        if (i === 0 && j === 0) continue;
                        const newX = x + i;
                        const newY = y + j;
                        if (newX >= 0 && newX < this.GRID_SIZE && newY >= 0 && newY < this.GRID_SIZE) {
                            if (this.grid[newY][newX].active) {
                                count++;
                            }
                        }
                    }
                }
                return count;
            }

            applySymmetry(newGrid) {
                const mid = Math.floor(this.GRID_SIZE / 2);
                for (let y = 0; y < mid; y++) {
                    for (let x = 0; x < mid; x++) {
                        newGrid[y][this.GRID_SIZE-1-x] = {...newGrid[y][x]};
                        newGrid[this.GRID_SIZE-1-y][x] = {...newGrid[y][x]};
                        newGrid[this.GRID_SIZE-1-y][this.GRID_SIZE-1-x] = {...newGrid[y][x]};
                    }
                }
                return newGrid;
            }

            updateGrid() {
                let newGrid = this.grid.map((row, y) => 
                    row.map((cell, x) => {
                        const neighbors = this.getNeighbors(x, y);
                        let nextActive = cell.active;
                        
                        if (cell.active) {
                            nextActive = this.rules.survive.includes(neighbors);
                        } else {
                            nextActive = this.rules.birth.includes(neighbors);
                        }

                        // Add random activation chance
                        if (!nextActive && Math.random() < 0.001) {
                            nextActive = true;
                        }

                        // Calculate wave effect
                        const time = Date.now() * 0.0003;
                        const waveEffect = Math.sin(time + (x + y) * 0.1) * 0.05;
                        const xDiff = x - this.GRID_SIZE/2;
                        const yDiff = y - this.GRID_SIZE/2;
                        const distanceToCenter = Math.sqrt(xDiff * xDiff + yDiff * yDiff) / (this.GRID_SIZE * 0.707);
                        
                        // Calculate intensity changes
                        let nextIntensity = 0;
                        if (nextActive) {
                            if (!cell.active) {
                                nextIntensity = 0.1;  // Start lower for smoother fade-in
                            } else {
                                nextIntensity = Math.min(0.7, cell.intensity + 0.05);  // Slower ramp up
                            }
                        } else if (cell.active) {
                            nextIntensity = Math.max(0, cell.intensity - 0.05);  // Slower fade out
                            if (nextIntensity < 0.05) nextIntensity = 0;
                        }
                        
                        const nextEnergy = Math.max(0, Math.min(0.7,
                            (cell.energy * 0.95) + (nextActive ? 0.05 : -0.05) +
                            (waveEffect * (1 - distanceToCenter))
                        ));

                        return {
                            active: nextActive || nextIntensity > 0,
                            intensity: nextIntensity,
                            age: nextActive ? (cell.active ? cell.age + 1 : 0) : 0,
                            energy: nextEnergy
                        };
                    })
                );

                // Check if we need to reset
                let activeCount = 0;
                for (let y = 0; y < this.GRID_SIZE; y += 2) {
                    for (let x = 0; x < this.GRID_SIZE; x += 2) {
                        if (newGrid[y][x].active) activeCount++;
                    }
                }
                
                const cellsChecked = (this.GRID_SIZE/2) * (this.GRID_SIZE/2);
                if (activeCount > cellsChecked * 0.9 || activeCount < cellsChecked * 0.05) {
                    this.initializeGrid();
                    return;
                }

                this.grid = this.applySymmetry(newGrid);
                this.renderGrid();
            }

            renderGrid() {
                const gridElement = document.getElementById('gameGrid');
                if (!gridElement) return;

                // Create grid structure only once
                if (gridElement.children.length === 0) {
                    this.grid.forEach((row, y) => {
                        const rowElement = document.createElement('div');
                        rowElement.className = 'grid-row';
                        
                        row.forEach((cell, x) => {
                            const cellElement = document.createElement('div');
                            cellElement.className = 'cell';
                            cellElement.dataset.x = x;
                            cellElement.dataset.y = y;
                            rowElement.appendChild(cellElement);
                        });
                        
                        gridElement.appendChild(rowElement);
                    });
                }

                // Update existing cells smoothly
                this.grid.forEach((row, y) => {
                    row.forEach((cell, x) => {
                        const cellElement = gridElement.children[y].children[x];
                        
                        const edgeFade = Math.min(x, y, this.GRID_SIZE - x - 1, this.GRID_SIZE - y - 1) / (this.GRID_SIZE / 2);
                        const isActive = cell.active;
                        
                        const opacityMultiplier = 1.0;
                        const bgColor = isActive 
                            ? `rgba(23, 23, 23, ${Math.min(0.3, cell.intensity * edgeFade * opacityMultiplier)})` 
                            : `rgba(255, 255, 255, ${Math.min(0.3, cell.intensity * edgeFade * opacityMultiplier)})`;
                        
                        cellElement.style.backgroundColor = bgColor;
                    });
                });
            }

            startAnimation() {
                const animate = (timestamp) => {
                    if (timestamp - this.lastUpdate >= 1500) { // Update every 1.5 seconds (slower)
                        this.lastUpdate = timestamp;
                        if (this.isVisible) {
                            this.updateGrid();
                        }
                    }
                    
                    this.animationId = requestAnimationFrame(animate);
                };
                
                this.animationId = requestAnimationFrame(animate);
            }

            destroy() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }
        }

        // Molecule tooltip functionality (unchanged from original)
        let RDKit = null;
        let smilesData = null;
        let rdkitLoaded = false;
        let currentTooltip = null;
        let tooltipTimeout = null;
        
        // Heatmap highlighting functionality
        let currentHighlights = [];
        let heatmapData = null;
        let heatmapLabels = { x: [], y: [] };
        
        // Initialize RDKit
        initRDKitModule().then(function(RDKit_module) {
            RDKit = RDKit_module;
            rdkitLoaded = true;
            console.log('RDKit initialized successfully');
        }).catch(error => {
            console.error('Error initializing RDKit:', error);
            console.log('Will use web service fallback for structure rendering');
        });
        
        // Load SMILES data
        fetch('/api/smiles-data')
            .then(response => response.json())
            .then(data => {
                smilesData = data;
                console.log('SMILES data loaded:', smilesData);
            })
            .catch(error => {
                console.error('Error loading SMILES data:', error);
            });
        
        // Function to draw molecule structure using RDKit
        function drawMoleculeRDKit(smiles, width = 120, height = 80) {
            if (!RDKit || !smiles) return null;
            
            try {
                const mol = RDKit.get_mol(smiles);
                if (!mol || !mol.is_valid()) {
                    console.warn('Invalid molecule:', smiles);
                    return null;
                }
                
                const svg = mol.get_svg(width, height);
                mol.delete();
                return svg;
            } catch (error) {
                console.error('Error drawing molecule:', error);
                return null;
            }
        }
        
        // Function to get molecule image URL using web service
        function getMoleculeImageUrl(smiles, width = 180, height = 120) {
            const encodedSmiles = encodeURIComponent(smiles);
            return `https://www.chemspider.com/ImagesHandler.ashx?w=${width}&h=${height}&smiles=${encodedSmiles}`;
        }
        
        // Function to show molecule tooltip
        function showMoleculeTooltip(event, name, type) {
            if (!smilesData) return;
            
            const smiles = type === 'amine' ? smilesData.amines[name] : smilesData.acids[name];
            if (!smiles) return;
            
            if (tooltipTimeout) {
                clearTimeout(tooltipTimeout);
                tooltipTimeout = null;
            }
            
            if (currentTooltip && currentTooltip.dataset.compound === name) {
                return;
            }
            
            hideMoleculeTooltip();
            
            const tooltip = document.createElement('div');
            tooltip.className = 'molecule-tooltip';
            tooltip.dataset.compound = name;
            
            const structureDiv = document.createElement('div');
            structureDiv.className = 'structure';
            
            tooltip.appendChild(structureDiv);
            
            structureDiv.innerHTML = '<div class="loading-structure">Loading structure...</div>';
            
            const rect = event.target.getBoundingClientRect();
            
            // ===========================================
            // MANUAL TUNING POINTS FOR TOOLTIP POSITION
            // ===========================================
            
            if (type === 'amine') {
                // HORIZONTAL AXIS (bottom labels) - Tooltip appears above
                const HORIZONTAL_OFFSET = -150;  // ← TUNE: pixels right of label
                const VERTICAL_OFFSET = -115;  // ← TUNE: pixels above label (negative = above)
                
                tooltip.style.left = (rect.left + HORIZONTAL_OFFSET) + 'px';
                tooltip.style.top = (rect.top + VERTICAL_OFFSET) + 'px';
                
            } else if (type === 'acid') {
                // VERTICAL AXIS (left labels) - Tooltip appears to the right
                const HORIZONTAL_OFFSET = 50;  // ← TUNE: pixels right of label
                const VERTICAL_OFFSET = -100;   // ← TUNE: pixels above/below label
                
                tooltip.style.left = (rect.left + HORIZONTAL_OFFSET) + 'px';
                tooltip.style.top = (rect.top + VERTICAL_OFFSET) + 'px';
            }
            
            document.body.appendChild(tooltip);
            currentTooltip = tooltip;
            
            // No edge protection - simple positioning only
            
            if (rdkitLoaded) {
                const svg = drawMoleculeRDKit(smiles, 120, 80);
                if (svg) {
                    structureDiv.innerHTML = svg;
                } else {
                    const img = document.createElement('img');
                    img.src = getMoleculeImageUrl(smiles);
                    img.alt = 'Molecular structure';
                    img.onerror = function() {
                        structureDiv.innerHTML = '<div class="loading-structure">Structure not available</div>';
                    };
                    structureDiv.innerHTML = '';
                    structureDiv.appendChild(img);
                }
            } else {
                const img = document.createElement('img');
                img.src = getMoleculeImageUrl(smiles);
                img.alt = 'Molecular structure';
                img.onerror = function() {
                    structureDiv.innerHTML = '<div class="loading-structure">Structure not available</div>';
                };
                structureDiv.innerHTML = '';
                structureDiv.appendChild(img);
            }
        }
        
        function hideMoleculeTooltip() {
            if (currentTooltip) {
                currentTooltip.remove();
                currentTooltip = null;
            }
        }
        
        function scheduleHideTooltip(delay = 200) {
            if (tooltipTimeout) {
                clearTimeout(tooltipTimeout);
            }
            tooltipTimeout = setTimeout(hideMoleculeTooltip, delay);
        }

        // Heatmap highlighting functions
        function getHeatmapGridDimensions() {
            const heatmapDiv = document.getElementById('heatmap');
            if (!heatmapDiv) return null;
            
            console.log('Debugging heatmap structure...');
            
            // Method 1: Try to find actual heatmap cells (rectangles in SVG)
            const heatmapCells = heatmapDiv.querySelectorAll('g.heatmaplayer rect');
            if (heatmapCells.length > 0) {
                console.log('Found heatmap cells:', heatmapCells.length);
                const firstCell = heatmapCells[0].getBoundingClientRect();
                const lastCell = heatmapCells[heatmapCells.length - 1].getBoundingClientRect();
                
                // Calculate grid bounds from actual cells
                const gridLeft = firstCell.left;
                const gridTop = firstCell.top;
                const gridRight = lastCell.right;
                const gridBottom = lastCell.bottom;
                
                return {
                    rect: {
                        left: gridLeft,
                        top: gridTop,
                        width: gridRight - gridLeft,
                        height: gridBottom - gridTop
                    },
                    gridWidth: gridRight - gridLeft,
                    gridHeight: gridBottom - gridTop
                };
            }
            
            // Method 2: Try to find the heatmap layer with class 'hm'
            const heatmapLayer = heatmapDiv.querySelector('g.heatmaplayer');
            if (heatmapLayer) {
                console.log('Found heatmaplayer');
                const heatmapRect = heatmapLayer.getBoundingClientRect();
                return {
                    rect: heatmapRect,
                    gridWidth: heatmapRect.width,
                    gridHeight: heatmapRect.height
                };
            }
            
            // Method 3: Try to find the plot area more specifically
            const plotArea = heatmapDiv.querySelector('.plot-container .plotly .main-svg');
            if (plotArea) {
                console.log('Found main SVG');
                const plotRect = plotArea.getBoundingClientRect();
                // Look for the actual data area within this
                const cartesian = plotArea.querySelector('g.cartesianlayer');
                if (cartesian) {
                    const cartesianRect = cartesian.getBoundingClientRect();
                    return {
                        rect: cartesianRect,
                        gridWidth: cartesianRect.width * 0.7, // Estimate data area
                        gridHeight: cartesianRect.height * 0.85
                    };
                }
            }
            
            console.log('Falling back to estimates');
            // Method 4: Fallback
            const plotContainer = heatmapDiv.querySelector('.plot-container');
            if (plotContainer) {
                const plotRect = plotContainer.getBoundingClientRect();
                return {
                    rect: plotRect,
                    gridWidth: plotRect.width - 130,
                    gridHeight: plotRect.height - 40
                };
            }
            
            return null;
        }

        function showHighlight(labelText, labelType) {
            hideHighlight(); // Clear any existing highlights
            
            const heatmapDiv = document.getElementById('heatmap');
            if (!heatmapDiv) return;
            
            const gridInfo = getHeatmapGridDimensions();
            if (!gridInfo) return;
            
            const heatmapRect = heatmapDiv.getBoundingClientRect();
            
            // Find the index of the label
            let labelIndex = -1;
            if (labelType === 'amine') {
                labelIndex = heatmapLabels.x.indexOf(labelText);
            } else if (labelType === 'acid') {
                labelIndex = heatmapLabels.y.indexOf(labelText);
            }
            
            if (labelIndex === -1) return;
            
            // Calculate precise cell dimensions
            const numRows = heatmapLabels.y.length;
            const numCols = heatmapLabels.x.length;
            
            if (numRows === 0 || numCols === 0) return;
            
            // Precise cell dimensions from actual grid
            const cellWidth = gridInfo.gridWidth / numCols;
            const cellHeight = gridInfo.gridHeight / numRows;
            
            // Calculate grid start position relative to heatmap container
            const gridStartX = gridInfo.rect.left - heatmapRect.left;
            const gridStartY = gridInfo.rect.top - heatmapRect.top;
            
            console.log('Grid dimensions:', {
                gridWidth: gridInfo.gridWidth,
                gridHeight: gridInfo.gridHeight,
                startX: gridStartX,
                startY: gridStartY,
                cellWidth: cellWidth,
                cellHeight: cellHeight,
                numRows: numRows,
                numCols: numCols
            });
            
            if (labelType === 'amine') {
                // Highlight entire column with one rectangle
                const overlay = document.createElement('div');
                overlay.className = 'highlight-overlay';
                overlay.style.left = (gridStartX + labelIndex * cellWidth) + 'px';
                overlay.style.top = gridStartY + 'px';
                overlay.style.width = cellWidth + 'px';
                overlay.style.height = gridInfo.gridHeight + 'px';
                
                console.log(`Column ${labelIndex} highlight:`, {
                    left: gridStartX + labelIndex * cellWidth,
                    top: gridStartY,
                    width: cellWidth,
                    height: gridInfo.gridHeight
                });
                
                heatmapDiv.appendChild(overlay);
                currentHighlights.push(overlay);
            } else if (labelType === 'acid') {
                // Highlight entire row with one rectangle
                const overlay = document.createElement('div');
                overlay.className = 'highlight-overlay';
                overlay.style.left = gridStartX + 'px';
                overlay.style.top = (gridStartY + labelIndex * cellHeight) + 'px';
                overlay.style.width = gridInfo.gridWidth + 'px';
                overlay.style.height = cellHeight + 'px';
                
                console.log(`Row ${labelIndex} highlight:`, {
                    left: gridStartX,
                    top: gridStartY + labelIndex * cellHeight,
                    width: gridInfo.gridWidth,
                    height: cellHeight
                });
                
                heatmapDiv.appendChild(overlay);
                currentHighlights.push(overlay);
            }
        }
        
        function hideHighlight() {
            currentHighlights.forEach(overlay => overlay.remove());
            currentHighlights = [];
        }

        // Function to highlight both row and column for a specific cell
        function showCellHighlight(colValue, rowValue) {
            hideHighlight(); // Clear any existing highlights
            
            const heatmapDiv = document.getElementById('heatmap');
            if (!heatmapDiv) return;
            
            const gridInfo = getHeatmapGridDimensions();
            if (!gridInfo) return;
            
            const heatmapRect = heatmapDiv.getBoundingClientRect();
            
            // Convert values to indices (Plotly gives us actual data values, not indices)
            const colIndex = heatmapLabels.x.indexOf(colValue);
            const rowIndex = heatmapLabels.y.indexOf(rowValue);
            
            if (colIndex === -1 || rowIndex === -1) {
                console.log('Could not find indices for:', { colValue, rowValue });
                return;
            }
            
            // Calculate precise cell dimensions
            const numRows = heatmapLabels.y.length;
            const numCols = heatmapLabels.x.length;
            
            if (numRows === 0 || numCols === 0) return;
            
            // Precise cell dimensions from actual grid
            const cellWidth = gridInfo.gridWidth / numCols;
            const cellHeight = gridInfo.gridHeight / numRows;
            
            // Calculate grid start position relative to heatmap container
            const gridStartX = gridInfo.rect.left - heatmapRect.left;
            const gridStartY = gridInfo.rect.top - heatmapRect.top;
            
            // Create column highlight (vertical)
            const columnOverlay = document.createElement('div');
            columnOverlay.className = 'highlight-overlay';
            columnOverlay.style.left = (gridStartX + colIndex * cellWidth) + 'px';
            columnOverlay.style.top = gridStartY + 'px';
            columnOverlay.style.width = cellWidth + 'px';
            columnOverlay.style.height = gridInfo.gridHeight + 'px';
            
            // Create row highlight (horizontal)
            const rowOverlay = document.createElement('div');
            rowOverlay.className = 'highlight-overlay';
            rowOverlay.style.left = gridStartX + 'px';
            rowOverlay.style.top = (gridStartY + rowIndex * cellHeight) + 'px';
            rowOverlay.style.width = gridInfo.gridWidth + 'px';
            rowOverlay.style.height = cellHeight + 'px';
            
            // Add both overlays
            heatmapDiv.appendChild(columnOverlay);
            heatmapDiv.appendChild(rowOverlay);
            currentHighlights.push(columnOverlay, rowOverlay);
            
            console.log(`Cell (${colIndex}, ${rowIndex}) highlight for (${colValue}, ${rowValue}):`, {
                column: { left: gridStartX + colIndex * cellWidth, width: cellWidth },
                row: { top: gridStartY + rowIndex * cellHeight, height: cellHeight }
            });
        }

        // Initialize Game of Life
        let gameOfLife;
        document.addEventListener('DOMContentLoaded', function() {
            gameOfLife = new GameOfLife();
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            if (gameOfLife) {
                const newGridSize = gameOfLife.getGridSize();
                if (newGridSize !== gameOfLife.GRID_SIZE) {
                    gameOfLife.GRID_SIZE = newGridSize;
                    gameOfLife.initializeGrid();
                }
            }
        });
        
        // Load and display heatmap
        fetch('/api/heatmap-data')
            .then(response => response.json())
            .then(data => {
                const plotData = JSON.parse(data);
                
                // Set responsive dimensions that fit within viewport
                let width, height = 830;  // Default height
                
                if (window.innerWidth <= 768) {
                    width = Math.min(window.innerWidth * 0.9, 800);
                    height = 640;  // Mobile
                } else if (window.innerWidth <= 1024) {
                    width = Math.min(window.innerWidth - 355, 900);
                    height = 720;  // Small laptop
                } else if (window.innerWidth >= 2560) {
                    width = Math.min(window.innerWidth - 555, 1200);
                    height = 960; // Large screens
                } else {
                    width = Math.min(window.innerWidth - 455, 1020); // Default
                }
                
                plotData.layout.width = width;
                plotData.layout.height = height;
                plotData.layout.margin = {l: 100, r: 30, t: 8, b: 30};
                plotData.layout.paper_bgcolor = 'rgba(0,0,0,0)';
                plotData.layout.plot_bgcolor = 'rgba(0,0,0,0)';
                
                // Store heatmap data and labels for highlighting
                heatmapData = plotData.data[0];
                heatmapLabels.x = heatmapData.x || [];
                heatmapLabels.y = heatmapData.y || [];
                
                // Disable cell tooltips - we only want our highlighting effect
                plotData.data[0].hovertemplate = '';
                plotData.data[0].hoverinfo = 'none';
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('heatmap').style.display = 'block';
                
                Plotly.newPlot('heatmap', plotData.data, plotData.layout, {
                    responsive: true,
                    displayModeBar: false,
                    displaylogo: false
                }).then(() => {
                    
                    // Add cell hover highlighting using Plotly events
                    const heatmapDiv = document.getElementById('heatmap');
                    
                    // When hovering over a cell
                    heatmapDiv.on('plotly_hover', function(data) {
                        if (data.points && data.points.length > 0) {
                            const point = data.points[0];
                            const colValue = point.x; // Column value (amine name)
                            const rowValue = point.y; // Row value (acid name)
                            
                            console.log('Cell hover:', { colValue, rowValue });
                            
                            // Highlight both row and column simultaneously
                            showCellHighlight(colValue, rowValue);
                        }
                    });
                    
                    // When leaving a cell
                    heatmapDiv.on('plotly_unhover', function(data) {
                        hideHighlight();
                    });
                    
                }).then(() => {
                    setTimeout(() => {
                        console.log('Setting up axis label hover listeners...');
                        
                        const heatmapDiv = document.getElementById('heatmap');
                        
                        heatmapDiv.addEventListener('mouseover', function(event) {
                            const target = event.target;
                            let labelText = null;
                            let labelType = null;
                            
                            if (target.closest('.xtick') || target.closest('.xaxislayer-above')) {
                                labelText = target.textContent || target.innerText;
                                labelType = 'amine';
                            }
                            else if (target.closest('.ytick') || target.closest('.yaxislayer-above')) {
                                labelText = target.textContent || target.innerText;
                                labelType = 'acid';
                            }
                            else if (target.tagName === 'text') {
                                const parent = target.parentNode;
                                if (parent && parent.classList) {
                                    if (parent.classList.contains('xtick')) {
                                        labelText = target.textContent;
                                        labelType = 'amine';
                                    } else if (parent.classList.contains('ytick')) {
                                        labelText = target.textContent;
                                        labelType = 'acid';
                                    }
                                }
                            }
                            
                            if (labelText && labelType && labelText.trim()) {
                                event.target.style.cursor = 'pointer';
                                showMoleculeTooltip(event, labelText.trim(), labelType);
                                showHighlight(labelText.trim(), labelType);
                            }
                        });
                        
                        heatmapDiv.addEventListener('mouseout', function(event) {
                            const target = event.target;
                            
                            if (target.closest('.xtick') || target.closest('.ytick') || 
                                target.closest('.xaxislayer-above') || target.closest('.yaxislayer-above') ||
                                target.tagName === 'text') {
                                target.style.cursor = 'default';
                                scheduleHideTooltip(200);
                                hideHighlight();
                            }
                        });
                        
                        const allTextElements = heatmapDiv.querySelectorAll('text');
                        
                        allTextElements.forEach((textElement, index) => {
                            const parent = textElement.parentNode;
                            if (parent && parent.classList) {
                                let isAxisLabel = false;
                                let labelType = null;
                                
                                if (parent.classList.contains('xtick')) {
                                    isAxisLabel = true;
                                    labelType = 'amine';
                                } else if (parent.classList.contains('ytick')) {
                                    isAxisLabel = true;
                                    labelType = 'acid';
                                }
                                
                                if (isAxisLabel) {
                                    textElement.addEventListener('mouseenter', function(event) {
                                        textElement.style.cursor = 'pointer';
                                        textElement.style.fill = '#007acc';
                                        textElement.style.fontWeight = 'bold';
                                        showMoleculeTooltip(event, textElement.textContent.trim(), labelType);
                                        showHighlight(textElement.textContent.trim(), labelType);
                                    });
                                    
                                    textElement.addEventListener('mouseleave', function(event) {
                                        textElement.style.cursor = 'default';
                                        textElement.style.fill = '';
                                        textElement.style.fontWeight = '';
                                        scheduleHideTooltip(200);
                                        hideHighlight();
                                    });
                                }
                            }
                        });
                        
                    }, 1000);
                });
            })
            .catch(error => {
                console.error('Error fetching heatmap data:', error);
                document.getElementById('loading').innerHTML = 'Error loading heatmap: ' + error.message;
            });
    </script>
</body>
