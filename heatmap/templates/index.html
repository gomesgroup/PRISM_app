<body>
    <!-- Game of Life Background -->
    <div class="game-of-life-container">
        <div class="grid-container">
            <div class="grid" id="gameGrid">
                <!-- Grid cells will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="header-container">
        <div class="title-wrapper">
            <h1 class="title">Data</h1>
            <div class="subtitle-wrapper">
                <h2 class="subtitle">Explore the space of</h2>
                <h2 class="subtitle">amide coupling reactions</h2>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="content-container">
        <div class="sidebar">
            <div class="sidebar-content">
                <div id="reaction-info" class="empty-sidebar">
                    <span id="empty-sidebar-text">Click any cell in the heatmap to compare reactions</span>
                </div>
            </div>
        </div>
        <div class="heatmap-wrapper">
    <div id="loading" class="loading">Loading heatmap...</div>
    <div id="heatmap" style="display: none;"></div>
        </div>
        <div class="scalebar">
            <div class="scalebar-container" id="scalebar-gradient">
                <!-- Gradient will be applied programmatically -->
                <div class="scalebar-indicator" id="scalebar-indicator"></div>
            </div>
            <div class="scalebar-title">Reaction Rate (M<sup>-1</sup> · min<sup>-1</sup>)</div>
        </div>
    </div>

    <script>
        // Game of Life Implementation
        class GameOfLife {
            constructor() {
                this.GRID_SIZE = this.getGridSize();
                this.grid = [];
                this.isVisible = true;
                this.animationId = null;
                this.lastUpdate = 0;
                this.rules = { survive: [2, 3], birth: [3, 6] }; // highlife rules
                
                this.initializeGrid();
                this.setupIntersectionObserver();
                this.startAnimation();
            }

            getGridSize() {
                const width = window.innerWidth;
                if (width <= 768) return 10;      // Mobile
                if (width <= 1024) return 12;     // Small laptop
                if (width >= 2560) return 16;     // Very large screens
                return 14;                         // Standard laptop/desktop
            }

            createCell(active) {
                return {
                    active: active,
                    intensity: active ? 0.7 : 0,
                    age: 0,
                    energy: Math.random() * 0.7
                };
            }

            initializeGrid() {
                const density = 0.4;
                this.grid = Array(this.GRID_SIZE).fill(null).map(() => 
                    Array(this.GRID_SIZE).fill(null).map(() => 
                        this.createCell(Math.random() < density)
                    )
                );
                this.renderGrid();
            }

            setupIntersectionObserver() {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        this.isVisible = entry.isIntersecting;
                    },
                    { threshold: 0.1 }
                );

                const container = document.querySelector('.game-of-life-container');
                if (container) {
                    observer.observe(container);
                }
            }

            getNeighbors(x, y) {
                let count = 0;
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        if (i === 0 && j === 0) continue;
                        const newX = x + i;
                        const newY = y + j;
                        if (newX >= 0 && newX < this.GRID_SIZE && newY >= 0 && newY < this.GRID_SIZE) {
                            if (this.grid[newY][newX].active) {
                                count++;
                            }
                        }
                    }
                }
                return count;
            }

            applySymmetry(newGrid) {
                const mid = Math.floor(this.GRID_SIZE / 2);
                for (let y = 0; y < mid; y++) {
                    for (let x = 0; x < mid; x++) {
                        newGrid[y][this.GRID_SIZE-1-x] = {...newGrid[y][x]};
                        newGrid[this.GRID_SIZE-1-y][x] = {...newGrid[y][x]};
                        newGrid[this.GRID_SIZE-1-y][this.GRID_SIZE-1-x] = {...newGrid[y][x]};
                    }
                }
                return newGrid;
            }

            updateGrid() {
                let newGrid = this.grid.map((row, y) => 
                    row.map((cell, x) => {
                        const neighbors = this.getNeighbors(x, y);
                        let nextActive = cell.active;
                        
                        if (cell.active) {
                            nextActive = this.rules.survive.includes(neighbors);
                        } else {
                            nextActive = this.rules.birth.includes(neighbors);
                        }

                        // Add random activation chance
                        if (!nextActive && Math.random() < 0.001) {
                            nextActive = true;
                        }

                        // Calculate wave effect
                        const time = Date.now() * 0.0003;
                        const waveEffect = Math.sin(time + (x + y) * 0.1) * 0.05;
                        const xDiff = x - this.GRID_SIZE/2;
                        const yDiff = y - this.GRID_SIZE/2;
                        const distanceToCenter = Math.sqrt(xDiff * xDiff + yDiff * yDiff) / (this.GRID_SIZE * 0.707);
                        
                        // Calculate intensity changes
                        let nextIntensity = 0;
                        if (nextActive) {
                            if (!cell.active) {
                                nextIntensity = 0.1;  // Start lower for smoother fade-in
                            } else {
                                nextIntensity = Math.min(0.7, cell.intensity + 0.05);  // Slower ramp up
                            }
                        } else if (cell.active) {
                            nextIntensity = Math.max(0, cell.intensity - 0.05);  // Slower fade out
                            if (nextIntensity < 0.05) nextIntensity = 0;
                        }
                        
                        const nextEnergy = Math.max(0, Math.min(0.7,
                            (cell.energy * 0.95) + (nextActive ? 0.05 : -0.05) +
                            (waveEffect * (1 - distanceToCenter))
                        ));

                        return {
                            active: nextActive || nextIntensity > 0,
                            intensity: nextIntensity,
                            age: nextActive ? (cell.active ? cell.age + 1 : 0) : 0,
                            energy: nextEnergy
                        };
                    })
                );

                // Check if we need to reset
                let activeCount = 0;
                for (let y = 0; y < this.GRID_SIZE; y += 2) {
                    for (let x = 0; x < this.GRID_SIZE; x += 2) {
                        if (newGrid[y][x].active) activeCount++;
                    }
                }
                
                const cellsChecked = (this.GRID_SIZE/2) * (this.GRID_SIZE/2);
                if (activeCount > cellsChecked * 0.9 || activeCount < cellsChecked * 0.05) {
                    this.initializeGrid();
                    return;
                }

                this.grid = this.applySymmetry(newGrid);
                this.renderGrid();
            }

            renderGrid() {
                const gridElement = document.getElementById('gameGrid');
                if (!gridElement) return;

                // Create grid structure only once
                if (gridElement.children.length === 0) {
                    this.grid.forEach((row, y) => {
                        const rowElement = document.createElement('div');
                        rowElement.className = 'grid-row';
                        
                        row.forEach((cell, x) => {
                            const cellElement = document.createElement('div');
                            cellElement.className = 'cell';
                            cellElement.dataset.x = x;
                            cellElement.dataset.y = y;
                            rowElement.appendChild(cellElement);
                        });
                        
                        gridElement.appendChild(rowElement);
                    });
                }

                // Update existing cells smoothly
                this.grid.forEach((row, y) => {
                    row.forEach((cell, x) => {
                        const cellElement = gridElement.children[y].children[x];
                        
                        const edgeFade = Math.min(x, y, this.GRID_SIZE - x - 1, this.GRID_SIZE - y - 1) / (this.GRID_SIZE / 2);
                        const isActive = cell.active;
                        
                        const opacityMultiplier = 1.0;
                        const bgColor = isActive 
                            ? `rgba(23, 23, 23, ${Math.min(0.3, cell.intensity * edgeFade * opacityMultiplier)})` 
                            : `rgba(255, 255, 255, ${Math.min(0.3, cell.intensity * edgeFade * opacityMultiplier)})`;
                        
                        cellElement.style.backgroundColor = bgColor;
                    });
                });
            }

            startAnimation() {
                const animate = (timestamp) => {
                    if (timestamp - this.lastUpdate >= 1500) { // Update every 1.5 seconds (slower)
                        this.lastUpdate = timestamp;
                        if (this.isVisible) {
                            this.updateGrid();
                        }
                    }
                    
                    this.animationId = requestAnimationFrame(animate);
                };
                
                this.animationId = requestAnimationFrame(animate);
            }

            destroy() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }
        }

        // Function to create SVG rate plot
        function createRatePlotSVG(data, width = 340, height = 200) {
            const times = data.times;
            const oneOverA = data.one_over_a;
            
            if (!times || !oneOverA || times.length === 0) {
                return '<div class="loading-rate-plot">No data available</div>';
            }
            
            const margin = { top: 20, right: 20, bottom: 40, left: 80 }; // More left margin to give y-axis label proper space
            const plotWidth = width - margin.left - margin.right;
            const plotHeight = height - margin.top - margin.bottom;
            
            // Check if there's variation in time data
            const maxTime = Math.max(...times);
            const minTime = Math.min(...times);
            const hasTimeVariation = maxTime !== minTime;
            
            // Check if we have insufficient data for slope calculation
            if (!hasTimeVariation || times.length === 1) {
                return `<div style="width: ${width}px; height: ${height}px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; box-sizing: border-box;">
                    <div style="font-size: 16px; font-weight: bold; color: #d32f2f; margin: 0 0 8px 0; padding: 0; line-height: 1.2;">
                        Reaction is faster than detection limit
                    </div>
                    <div style="font-size: 14px; color: #666; margin: 0; padding: 0; line-height: 1.3;">
                        Displayed rate may be unreliable
                    </div>
                </div>`;
            }
            
            let slope, intercept, lineStartX, lineEndX, lineStartY, lineEndY;
            let maxOneOverA, minOneOverA;
            
            if (hasTimeVariation) {
                // Calculate line of best fit only if there's time variation
                const n = times.length;
                const sumX = times.reduce((sum, t) => sum + t, 0);
                const sumY = oneOverA.reduce((sum, y) => sum + y, 0);
                const sumXY = times.reduce((sum, t, i) => sum + t * oneOverA[i], 0);
                const sumXX = times.reduce((sum, t) => sum + t * t, 0);
                
                slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
                intercept = (sumY - slope * sumX) / n;
                
                // Calculate line endpoints
                lineStartX = minTime;
                lineEndX = maxTime;
                lineStartY = slope * lineStartX + intercept;
                lineEndY = slope * lineEndX + intercept;
                
                // Calculate scales including both data and line of best fit
                maxOneOverA = Math.max(...oneOverA, lineStartY, lineEndY);
                minOneOverA = Math.min(...oneOverA, lineStartY, lineEndY);
            } else {
                // No time variation - just use data points for scaling
                maxOneOverA = Math.max(...oneOverA);
                minOneOverA = Math.min(...oneOverA);
                
                // Add some padding to the scale for better visualization
                const range = maxOneOverA - minOneOverA;
                const padding = range > 0 ? range * 0.1 : 0.1; // 10% padding or 0.1 if no variation
                maxOneOverA += padding;
                minOneOverA -= padding;
            }
            
            // Create scale functions
            const xScale = hasTimeVariation ? 
                (x) => ((x - minTime) / (maxTime - minTime)) * plotWidth :
                (x) => plotWidth / 2; // Center points when no time variation
            const yScale = (y) => plotHeight - ((y - minOneOverA) / (maxOneOverA - minOneOverA)) * plotHeight;
            
            // Create SVG
            let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
            
            // Add background
            svg += `<rect width="${width}" height="${height}" fill="white"/>`;
            
            // Create main plot group
            svg += `<g transform="translate(${margin.left}, ${margin.top})">`;
            
            // Draw grid lines
            const xTicks = 5;
            const yTicks = 4;
            
            for (let i = 0; i <= xTicks; i++) {
                const x = (i / xTicks) * plotWidth;
                svg += `<line x1="${x}" y1="0" x2="${x}" y2="${plotHeight}" stroke="#e0e0e0" stroke-width="0.5"/>`;
                
                // X-axis labels
                if (hasTimeVariation) {
                    const xValue = minTime + (i / xTicks) * (maxTime - minTime);
                    svg += `<text x="${x}" y="${plotHeight + 20}" text-anchor="middle" font-size="10" fill="#666">${xValue.toFixed(1)}</text>`;
                } else {
                    // For no time variation, just show the single time value
                    if (i === Math.floor(xTicks / 2)) { // Only show label in the middle
                        svg += `<text x="${x}" y="${plotHeight + 20}" text-anchor="middle" font-size="10" fill="#666">${minTime.toFixed(1)}</text>`;
                    }
                }
            }
            
            for (let i = 0; i <= yTicks; i++) {
                const y = (i / yTicks) * plotHeight;
                svg += `<line x1="0" y1="${plotHeight - y}" x2="${plotWidth}" y2="${plotHeight - y}" stroke="#e0e0e0" stroke-width="0.5"/>`;
                
                // Y-axis labels
                const yValue = minOneOverA + (i / yTicks) * (maxOneOverA - minOneOverA);
                svg += `<text x="-15" y="${plotHeight - y + 4}" text-anchor="end" font-size="10" fill="#666">${yValue.toFixed(2)}</text>`;
            }
            
            // Draw axes
            svg += `<line x1="0" y1="${plotHeight}" x2="${plotWidth}" y2="${plotHeight}" stroke="#666" stroke-width="1"/>`;
            svg += `<line x1="0" y1="0" x2="0" y2="${plotHeight}" stroke="#666" stroke-width="1"/>`;
            
            // Draw line of best fit only if there's time variation
            if (hasTimeVariation) {
                svg += `<line x1="${xScale(lineStartX)}" y1="${yScale(lineStartY)}" 
                             x2="${xScale(lineEndX)}" y2="${yScale(lineEndY)}" 
                             stroke="black" stroke-width="2" opacity="0.9"/>`;
            }
            
            // Draw scatter points
            for (let i = 0; i < times.length; i++) {
                const x = xScale(times[i]);
                const y = yScale(oneOverA[i]);
                
                // Draw scatter point
                svg += `<circle cx="${x}" cy="${y}" r="4" fill="#007acc"/>`;
            }
            
            // Add axis labels
            svg += `<text x="${plotWidth/2}" y="${plotHeight + 35}" text-anchor="middle" font-size="12" fill="#333">Time (min)</text>`;
            svg += `<text x="-65" y="${plotHeight/2}" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90, -65, ${plotHeight/2})">1/[A] (M⁻¹)</text>`;
            
            svg += '</g></svg>';
            
            return svg;
        }

        // Function to update scalebar with heatmap color scheme and data range
        function updateScalebar(heatmapData) {
            if (!heatmapData) {
                return;
            }
            
            // Use original values from customdata (not the SymLogNorm transformed z values)
            let minVal = Infinity;
            let maxVal = -Infinity;
            
            // Get original values from customdata if available, otherwise fall back to z
            const dataToUse = heatmapData.customdata || heatmapData.z;
            
            if (dataToUse) {
                dataToUse.forEach(row => {
                    row.forEach(val => {
                        if (val !== null && val !== undefined && !isNaN(val)) {
                            minVal = Math.min(minVal, val);
                            maxVal = Math.max(maxVal, val);
                        }
                    });
                });
            }
            
            // Note: Min/max values are calculated for tick positioning but not displayed
            
            // Create color gradient that matches the heatmap's Cividis color scheme
            const scalebarContainer = document.getElementById('scalebar-gradient');
            
            if (scalebarContainer) {
                // Remove any existing tick marks
                scalebarContainer.querySelectorAll('.scalebar-tick, .scalebar-tick-label').forEach(el => el.remove());
                
                // Use Cividis colorscale that exactly matches the heatmap - correct Plotly implementation
                const gradient = `linear-gradient(to right, 
                    rgb(0, 32, 76),
                    rgb(0, 42, 102),
                    rgb(31, 82, 123),
                    rgb(85, 104, 118),
                    rgb(122, 120, 104),
                    rgb(178, 171, 88),
                    rgb(224, 196, 61),
                    rgb(253, 231, 37))`;
                
                scalebarContainer.style.background = gradient;
                
                // Add tick marks that represent the SymLogNorm scaling
                addScalebarTicks(minVal, maxVal, scalebarContainer);
            }
        }
        
        // Function to add tick marks that reflect SymLogNorm scaling
        function addScalebarTicks(minVal, maxVal, container) {
            // Use exact tick values as specified by user
            const desiredTicks = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
            const linthresh = 10;
            
            // Filter to values within our data range
            const validTicks = desiredTicks.filter(t => t >= minVal && t <= maxVal);
            
            // Apply SymLogNorm transformation (matching backend logic)
            function symlogTransform(x, linthresh) {
                const absX = Math.abs(x);
                const signX = Math.sign(x);
                
                if (absX <= linthresh) {
                    return x; // Linear region
                } else {
                    return signX * linthresh * (1 + Math.log(absX / linthresh)); // Log region
                }
            }
            
            // Transform all values to determine range
            const transformedValid = validTicks.map(t => symlogTransform(t, linthresh));
            const transformedMin = symlogTransform(minVal, linthresh);
            const transformedMax = symlogTransform(maxVal, linthresh);
            
            validTicks.forEach(originalValue => {
                const transformedValue = symlogTransform(originalValue, linthresh);
                
                // Calculate position as percentage across the scalebar
                const position = ((transformedValue - transformedMin) / (transformedMax - transformedMin)) * 100;
                
                // Create tick mark (positioned below the scalebar)
                const tick = document.createElement('div');
                tick.className = 'scalebar-tick';
                tick.style.cssText = `
                    position: absolute;
                    left: ${position}%;
                    top: 100%;
                    width: 2px;
                    height: 8px;
                    background-color: #333;
                    transform: translateX(-50%);
                `;
                
                // Create tick label (positioned below the tick)
                const label = document.createElement('div');
                label.className = 'scalebar-tick-label';
                label.style.cssText = `
                    position: absolute;
                    left: ${position}%;
                    top: 100%;
                    transform: translateX(-50%);
                    margin-top: 10px;
                    font-size: 10px;
                    color: #666;
                    white-space: nowrap;
                    font-family: Arial, sans-serif;
                `;
                
                // Format label based on value using scientific notation
                if (originalValue >= 1000) {
                    label.textContent = originalValue.toExponential(0);
                } else {
                    label.textContent = originalValue.toString();
                }
                
                container.appendChild(tick);
                container.appendChild(label);
            });
        }

        // Heatmap highlighting functions
        function getHeatmapGridDimensions() {
            const heatmapDiv = document.getElementById('heatmap');
            if (!heatmapDiv) return null;
            
            console.log('Debugging heatmap structure...');
            
            // Method 1: Try to find actual heatmap cells (rectangles in SVG)
            const heatmapCells = heatmapDiv.querySelectorAll('g.heatmaplayer rect');
            if (heatmapCells.length > 0) {
                console.log('Found heatmap cells:', heatmapCells.length);
                const firstCell = heatmapCells[0].getBoundingClientRect();
                const lastCell = heatmapCells[heatmapCells.length - 1].getBoundingClientRect();
                
                // Calculate grid bounds from actual cells
                const gridLeft = firstCell.left;
                const gridTop = firstCell.top;
                const gridRight = lastCell.right;
                const gridBottom = lastCell.bottom;
                
                return {
                    rect: {
                        left: gridLeft,
                        top: gridTop,
                        width: gridRight - gridLeft,
                        height: gridBottom - gridTop
                    },
                    gridWidth: gridRight - gridLeft,
                    gridHeight: gridBottom - gridTop
                };
            }
            
            // Method 2: Try to find the heatmap layer with class 'hm'
            const heatmapLayer = heatmapDiv.querySelector('g.heatmaplayer');
            if (heatmapLayer) {
                console.log('Found heatmaplayer');
                const heatmapRect = heatmapLayer.getBoundingClientRect();
                return {
                    rect: heatmapRect,
                    gridWidth: heatmapRect.width,
                    gridHeight: heatmapRect.height
                };
            }
            
            // Method 3: Try to find the plot area more specifically
            const plotArea = heatmapDiv.querySelector('.plot-container .plotly .main-svg');
            if (plotArea) {
                console.log('Found main SVG');
                const plotRect = plotArea.getBoundingClientRect();
                // Look for the actual data area within this
                const cartesian = plotArea.querySelector('g.cartesianlayer');
                if (cartesian) {
                    const cartesianRect = cartesian.getBoundingClientRect();
                    return {
                        rect: cartesianRect,
                        gridWidth: cartesianRect.width * 0.7, // Estimate data area
                        gridHeight: cartesianRect.height * 0.85
                    };
                }
            }
            
            console.log('Falling back to estimates');
            // Method 4: Fallback
            const plotContainer = heatmapDiv.querySelector('.plot-container');
            if (plotContainer) {
                const plotRect = plotContainer.getBoundingClientRect();
                return {
                    rect: plotRect,
                    gridWidth: plotRect.width - 130,
                    gridHeight: plotRect.height - 40
                };
            }
            
            return null;
        }

                overlay.style.left = gridStartX + 'px';
                overlay.style.top = (gridStartY + labelIndex * cellHeight) + 'px';
                overlay.style.width = gridInfo.gridWidth + 'px';
                overlay.style.height = cellHeight + 'px';
                
                console.log(`Row ${labelIndex} highlight:`, {
                    left: gridStartX,
                    top: gridStartY + labelIndex * cellHeight,
                    width: gridInfo.gridWidth,
                    height: cellHeight
                });
                
                heatmapDiv.appendChild(overlay);
                currentHighlights.push(overlay);
            }
        }
        
        function hideHighlight() {
            currentHighlights.forEach(overlay => overlay.remove());
            currentHighlights = [];
        }

        // Function to highlight both row and column for a specific cell
        function showCellHighlight(colValue, rowValue) {
            hideHighlight(); // Clear any existing highlights
            
            const heatmapDiv = document.getElementById('heatmap');
            if (!heatmapDiv) return;
            
            const gridInfo = getHeatmapGridDimensions();
            if (!gridInfo) return;
            
            const heatmapRect = heatmapDiv.getBoundingClientRect();
            
            // Convert values to indices (Plotly gives us actual data values, not indices)
            const colIndex = heatmapLabels.x.indexOf(colValue);
            const rowIndex = heatmapLabels.y.indexOf(rowValue);
            
            if (colIndex === -1 || rowIndex === -1) {
                console.log('Could not find indices for:', { colValue, rowValue });
                return;
            }
            
            // Calculate precise cell dimensions
            const numRows = heatmapLabels.y.length;
            const numCols = heatmapLabels.x.length;
            
            if (numRows === 0 || numCols === 0) return;
            
            // Precise cell dimensions from actual grid
            const cellWidth = gridInfo.gridWidth / numCols;
            const cellHeight = gridInfo.gridHeight / numRows;
            
            // Calculate grid start position relative to heatmap container
            const gridStartX = gridInfo.rect.left - heatmapRect.left;
            const gridStartY = gridInfo.rect.top - heatmapRect.top;
            
            // Create column highlight (vertical)
            const columnOverlay = document.createElement('div');
            columnOverlay.className = 'highlight-overlay';
            columnOverlay.style.left = (gridStartX + colIndex * cellWidth) + 'px';
            columnOverlay.style.top = gridStartY + 'px';
            columnOverlay.style.width = cellWidth + 'px';
            columnOverlay.style.height = gridInfo.gridHeight + 'px';
            
            // Create row highlight (horizontal)
            const rowOverlay = document.createElement('div');
            rowOverlay.className = 'highlight-overlay';
            rowOverlay.style.left = gridStartX + 'px';
            rowOverlay.style.top = (gridStartY + rowIndex * cellHeight) + 'px';
            rowOverlay.style.width = gridInfo.gridWidth + 'px';
            rowOverlay.style.height = cellHeight + 'px';
            
            // Add both overlays
            heatmapDiv.appendChild(columnOverlay);
            heatmapDiv.appendChild(rowOverlay);
            currentHighlights.push(columnOverlay, rowOverlay);
            
            console.log(`Cell (${colIndex}, ${rowIndex}) highlight for (${colValue}, ${rowValue}):`, {
                column: { left: gridStartX + colIndex * cellWidth, width: cellWidth },
                row: { top: gridStartY + rowIndex * cellHeight, height: cellHeight }
            });
        }

        // Initialize Game of Life
        let gameOfLife;
        document.addEventListener('DOMContentLoaded', function() {
            gameOfLife = new GameOfLife();
            // Initialize the max cells display
            updateMaxCellsDisplay();
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            if (gameOfLife) {
                const newGridSize = gameOfLife.getGridSize();
                if (newGridSize !== gameOfLife.GRID_SIZE) {
                    gameOfLife.GRID_SIZE = newGridSize;
                    gameOfLife.initializeGrid();
                }
            }
            // Refresh selected cell borders and scalebar indicators on resize
            setTimeout(() => {
                refreshSelectedCellBorders();
                refreshSelectedScalebarIndicators();
            }, 100);
        });
        
        // Load and display heatmap
        fetch('/api/heatmap-data')
            .then(response => response.json())
            .then(data => {
                const plotData = JSON.parse(data);
                
                // Set responsive dimensions that fit within viewport
                let width, height = 830;  // Default height
                
                if (window.innerWidth <= 768) {
                    width = Math.min(window.innerWidth * 0.9, 800);
                    height = 640;  // Mobile
                } else if (window.innerWidth <= 1024) {
                    width = Math.min(window.innerWidth - 355, 900);
                    height = 720;  // Small laptop
                } else if (window.innerWidth >= 2560) {
                    width = Math.min(window.innerWidth - 555, 1200);
                    height = 960; // Large screens
                } else {
                    width = Math.min(window.innerWidth - 455, 1020); // Default
                }
                
                plotData.layout.width = width;
                plotData.layout.height = height;
                plotData.layout.margin = {l: 100, r: 30, t: 8, b: 30};
                plotData.layout.paper_bgcolor = 'rgba(0,0,0,0)';
                plotData.layout.plot_bgcolor = 'rgba(0,0,0,0)';
                
                // Store heatmap data and labels for highlighting
                heatmapData = plotData.data[0];
                heatmapLabels.x = heatmapData.x || [];
                heatmapLabels.y = heatmapData.y || [];
                
                // Update scalebar with heatmap data
                updateScalebar(heatmapData);
                
                // Disable cell tooltips - we only want our highlighting effect
                plotData.data[0].hovertemplate = '';
                plotData.data[0].hoverinfo = 'none';
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('heatmap').style.display = 'block';
                
                Plotly.newPlot('heatmap', plotData.data, plotData.layout, {
                    responsive: true,
                    displayModeBar: false,
                    displaylogo: false
                }).then(() => {
                        
                    // Add cell hover highlighting using Plotly events
                        const heatmapDiv = document.getElementById('heatmap');
                        
                    // When hovering over a cell
                    heatmapDiv.on('plotly_hover', function(data) {
                        if (data.points && data.points.length > 0) {
                            const point = data.points[0];
                            const colValue = point.x; // Column value (amine name)
                            const rowValue = point.y; // Row value (acid name)
                            const reactionRate = point.customdata; // Original reaction rate
                            
                            console.log('Cell hover:', { colValue, rowValue, reactionRate });
                            
                            // Reset styling from previous cell if any
                            if (currentHoveredCell) {
                                resetAxisLabelStyling(currentHoveredCell.amine, currentHoveredCell.acid);
                            }
                            
                            // Store current cell
                            currentHoveredCell = { amine: colValue, acid: rowValue };
                            
                            // Highlight both row and column simultaneously
                            showCellHighlight(colValue, rowValue);
                            
                            // Show tooltips for corresponding axis labels
                            showAxisTooltipsForCell(colValue, rowValue);
                            
                            // Show scalebar indicator for the reaction rate
                            showScalebarIndicator(reactionRate);
                        }
                    });
                    
                    // When leaving a cell
                    heatmapDiv.on('plotly_unhover', function(data) {
                        hideHighlight();
                        scheduleHideTooltip(100);
                        
                        // Reset axis label styling
                        if (currentHoveredCell) {
                            resetAxisLabelStyling(currentHoveredCell.amine, currentHoveredCell.acid);
                            currentHoveredCell = null;
                        }
                        
                        // Hide scalebar indicator
                        hideScalebarIndicator();
                    });
                    
                    // When clicking a cell
                    heatmapDiv.on('plotly_click', function(data) {
                        if (data.points && data.points.length > 0) {
                            const point = data.points[0];
                            const acidName = point.y; // Row value (acid name)
                            const amineName = point.x; // Column value (amine name)
                            const reactionRate = point.customdata; // Original reaction rate (not normalized)
                            
                            console.log('Cell clicked:', { acidName, amineName, reactionRate });
                            
                            // Toggle cell selection for comparison
                            toggleCellSelection(acidName, amineName, reactionRate);
                            }
                    });
                    
                }).then(() => {
                    setTimeout(() => {
                        console.log('Setting up axis label hover listeners...');
                        
                        const heatmapDiv = document.getElementById('heatmap');
                        
                        heatmapDiv.addEventListener('mouseover', function(event) {
                            const target = event.target;
                            let labelText = null;
                            let labelType = null;
                            
                            if (target.closest('.xtick') || target.closest('.xaxislayer-above')) {
                                labelText = target.textContent || target.innerText;
                                labelType = 'amine';
                            }
                            else if (target.closest('.ytick') || target.closest('.yaxislayer-above')) {
                                labelText = target.textContent || target.innerText;
                                labelType = 'acid';
                            }
                            else if (target.tagName === 'text') {
                                const parent = target.parentNode;
                                if (parent && parent.classList) {
                                    if (parent.classList.contains('xtick')) {
                                        labelText = target.textContent;
                                        labelType = 'amine';
                                    } else if (parent.classList.contains('ytick')) {
                                        labelText = target.textContent;
                                        labelType = 'acid';
                                    }
                                }
                            }
                            
                            if (labelText && labelType && labelText.trim()) {
                                // Clear any existing tooltips first
                                hideMoleculeTooltip();
                                if (tooltipTimeout) {
                                    clearTimeout(tooltipTimeout);
                                    tooltipTimeout = null;
                                }
                                
                                event.target.style.cursor = 'pointer';
                                showMoleculeTooltip(event, labelText.trim(), labelType);
                                showHighlight(labelText.trim(), labelType);
                                hideScalebarIndicator(); // Hide scalebar indicator when hovering axis labels
                            }
                        });
                        
                        heatmapDiv.addEventListener('mouseout', function(event) {
                            const target = event.target;
                            
                            if (target.closest('.xtick') || target.closest('.ytick') || 
                                target.closest('.xaxislayer-above') || target.closest('.yaxislayer-above') ||
                                target.tagName === 'text') {
                                target.style.cursor = 'default';
                                scheduleHideTooltip(200);
                                hideHighlight();
                                hideScalebarIndicator(); // Hide scalebar indicator when leaving axis labels
                            }
                        });
                        
                        const allTextElements = heatmapDiv.querySelectorAll('text');
                        
                        allTextElements.forEach((textElement, index) => {
                            const parent = textElement.parentNode;
                            if (parent && parent.classList) {
                                let isAxisLabel = false;
                                let labelType = null;
                                
                                if (parent.classList.contains('xtick')) {
                                    isAxisLabel = true;
                                    labelType = 'amine';
                                } else if (parent.classList.contains('ytick')) {
                                    isAxisLabel = true;
                                    labelType = 'acid';
                                }
                                
                                if (isAxisLabel) {
                                    textElement.addEventListener('mouseenter', function(event) {
                                        // Clear any existing tooltips first
                                        hideMoleculeTooltip();
                                        if (tooltipTimeout) {
                                            clearTimeout(tooltipTimeout);
                                            tooltipTimeout = null;
                                        }
                                        
                                        textElement.style.cursor = 'pointer';
                                        textElement.style.fill = '#007acc';
                                        textElement.style.fontWeight = 'bold';
                                        showMoleculeTooltip(event, textElement.textContent.trim(), labelType);
                                        showHighlight(textElement.textContent.trim(), labelType);
                                        hideScalebarIndicator(); // Hide scalebar indicator when hovering axis labels
                                    });
                                    
                                    textElement.addEventListener('mouseleave', function(event) {
                                        textElement.style.cursor = 'default';
                                        textElement.style.fill = '';
                                        textElement.style.fontWeight = '';
                                        scheduleHideTooltip(200);
                                        hideHighlight();
                                        hideScalebarIndicator(); // Hide scalebar indicator when leaving axis labels
                                    });
                                }
                            }
                        });
                        
                    }, 1000);
                    
                    // Refresh selected cell borders and scalebar indicators after heatmap is fully loaded
                    setTimeout(() => {
                        refreshSelectedCellBorders();
                        refreshSelectedScalebarIndicators();
                    }, 1500);
                });
                    })
        .catch(error => {
            console.error('Error fetching heatmap data:', error);
            document.getElementById('loading').innerHTML = 'Error loading heatmap: ' + error.message;
        });
        

    </script>
</body>
</html>
