<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Avenir', 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            position: relative;
            overflow: hidden;
            background: white;
            color: #333;
        }

        /* Animated Background */
        .game-of-life-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .grid-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        .grid {
            display: grid;
            gap: 12px;
            transform: scale(1);
            position: relative;
            z-index: 0;
            will-change: transform;
            opacity: 0.5;
        }

        .grid-row {
            display: flex;
            gap: 16px;
        }

        .cell {
            transition: background-color 1200ms ease-in-out;
            will-change: background-color;
            border-radius: 2px;
            width: 80px;
            height: 80px;
        }

        /* Very Large Screens (Desktop monitors) */
        @media (min-width: 2560px) {
            .cell {
                width: 80px !important;
                height: 80px !important;
            }
            
            .grid-row {
                gap: 16px;
            }

            .grid {
                gap: 12px;
            }
        }

        /* Small Laptop Screens */
        @media (max-width: 1024px) {
            .cell {
                width: 50px !important;
                height: 50px !important;
            }

            .grid {
                gap: 6px;
            }

            .grid-row {
                gap: 8px;
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .cell {
                width: 40px !important;
                height: 40px !important;
            }

            .grid {
                gap: 4px;
            }

            .grid-row {
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="game-of-life-container">
        <div class="grid-container">
            <div class="grid" id="gameGrid">
                <!-- Grid cells will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Game of Life Implementation
        class GameOfLife {
            constructor() {
                this.GRID_SIZE = this.getGridSize();
                this.grid = [];
                this.isVisible = true;
                this.animationId = null;
                this.lastUpdate = 0;
                this.rules = { survive: [2, 3], birth: [3, 6] }; // highlife rules
                
                this.initializeGrid();
                this.setupIntersectionObserver();
                this.startAnimation();
            }

            getGridSize() {
                const width = window.innerWidth;
                if (width <= 768) return 10;      // Mobile
                if (width <= 1024) return 12;     // Small laptop
                if (width >= 2560) return 16;     // Very large screens
                return 14;                         // Standard laptop/desktop
            }

            createCell(active) {
                return {
                    active: active,
                    intensity: active ? 0.7 : 0,
                    age: 0,
                    energy: Math.random() * 0.7
                };
            }

            initializeGrid() {
                const density = 0.4;
                this.grid = Array(this.GRID_SIZE).fill(null).map(() => 
                    Array(this.GRID_SIZE).fill(null).map(() => 
                        this.createCell(Math.random() < density)
                    )
                );
                this.renderGrid();
            }

            setupIntersectionObserver() {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        this.isVisible = entry.isIntersecting;
                    },
                    { threshold: 0.1 }
                );

                const container = document.querySelector('.game-of-life-container');
                if (container) {
                    observer.observe(container);
                }
            }

            getNeighbors(x, y) {
                let count = 0;
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        if (i === 0 && j === 0) continue;
                        const newX = x + i;
                        const newY = y + j;
                        if (newX >= 0 && newX < this.GRID_SIZE && newY >= 0 && newY < this.GRID_SIZE) {
                            if (this.grid[newY][newX].active) {
                                count++;
                            }
                        }
                    }
                }
                return count;
            }

            applySymmetry(newGrid) {
                const mid = Math.floor(this.GRID_SIZE / 2);
                for (let y = 0; y < mid; y++) {
                    for (let x = 0; x < mid; x++) {
                        newGrid[y][this.GRID_SIZE-1-x] = {...newGrid[y][x]};
                        newGrid[this.GRID_SIZE-1-y][x] = {...newGrid[y][x]};
                        newGrid[this.GRID_SIZE-1-y][this.GRID_SIZE-1-x] = {...newGrid[y][x]};
                    }
                }
                return newGrid;
            }

            updateGrid() {
                let newGrid = this.grid.map((row, y) => 
                    row.map((cell, x) => {
                        const neighbors = this.getNeighbors(x, y);
                        let nextActive = cell.active;
                        
                        if (cell.active) {
                            nextActive = this.rules.survive.includes(neighbors);
                        } else {
                            nextActive = this.rules.birth.includes(neighbors);
                        }

                        // Add random activation chance
                        if (!nextActive && Math.random() < 0.001) {
                            nextActive = true;
                        }

                        // Calculate wave effect
                        const time = Date.now() * 0.0003;
                        const waveEffect = Math.sin(time + (x + y) * 0.1) * 0.05;
                        const xDiff = x - this.GRID_SIZE/2;
                        const yDiff = y - this.GRID_SIZE/2;
                        const distanceToCenter = Math.sqrt(xDiff * xDiff + yDiff * yDiff) / (this.GRID_SIZE * 0.707);
                        
                        // Calculate intensity changes
                        let nextIntensity = 0;
                        if (nextActive) {
                            if (!cell.active) {
                                nextIntensity = 0.1;  // Start lower for smoother fade-in
                            } else {
                                nextIntensity = Math.min(0.7, cell.intensity + 0.05);  // Slower ramp up
                            }
                        } else if (cell.active) {
                            nextIntensity = Math.max(0, cell.intensity - 0.05);  // Slower fade out
                            if (nextIntensity < 0.05) nextIntensity = 0;
                        }
                        
                        const nextEnergy = Math.max(0, Math.min(0.7,
                            (cell.energy * 0.95) + (nextActive ? 0.05 : -0.05) +
                            (waveEffect * (1 - distanceToCenter))
                        ));

                        return {
                            active: nextActive || nextIntensity > 0,
                            intensity: nextIntensity,
                            age: nextActive ? (cell.active ? cell.age + 1 : 0) : 0,
                            energy: nextEnergy
                        };
                    })
                );

                // Check if we need to reset
                let activeCount = 0;
                for (let y = 0; y < this.GRID_SIZE; y += 2) {
                    for (let x = 0; x < this.GRID_SIZE; x += 2) {
                        if (newGrid[y][x].active) activeCount++;
                    }
                }
                
                const cellsChecked = (this.GRID_SIZE/2) * (this.GRID_SIZE/2);
                if (activeCount > cellsChecked * 0.9 || activeCount < cellsChecked * 0.05) {
                    this.initializeGrid();
                    return;
                }

                this.grid = this.applySymmetry(newGrid);
                this.renderGrid();
            }

            renderGrid() {
                const gridElement = document.getElementById('gameGrid');
                if (!gridElement) return;

                // Create grid structure only once
                if (gridElement.children.length === 0) {
                    this.grid.forEach((row, y) => {
                        const rowElement = document.createElement('div');
                        rowElement.className = 'grid-row';
                        
                        row.forEach((cell, x) => {
                            const cellElement = document.createElement('div');
                            cellElement.className = 'cell';
                            cellElement.dataset.x = x;
                            cellElement.dataset.y = y;
                            rowElement.appendChild(cellElement);
                        });
                        
                        gridElement.appendChild(rowElement);
                    });
                }

                // Update existing cells smoothly
                this.grid.forEach((row, y) => {
                    row.forEach((cell, x) => {
                        const cellElement = gridElement.children[y].children[x];
                        
                        const edgeFade = Math.min(x, y, this.GRID_SIZE - x - 1, this.GRID_SIZE - y - 1) / (this.GRID_SIZE / 2);
                        const isActive = cell.active;
                        
                        const opacityMultiplier = 1.0;
                        const bgColor = isActive 
                            ? `rgba(23, 23, 23, ${Math.min(0.3, cell.intensity * edgeFade * opacityMultiplier)})` 
                            : `rgba(255, 255, 255, ${Math.min(0.3, cell.intensity * edgeFade * opacityMultiplier)})`;
                        
                        cellElement.style.backgroundColor = bgColor;
                    });
                });
            }

            startAnimation() {
                const animate = (timestamp) => {
                    if (timestamp - this.lastUpdate >= 1500) { // Update every 1.5 seconds (slower)
                        this.lastUpdate = timestamp;
                        if (this.isVisible) {
                            this.updateGrid();
                        }
                    }
                    
                    this.animationId = requestAnimationFrame(animate);
                };
                
                this.animationId = requestAnimationFrame(animate);
            }

            destroy() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }
        }

        // Initialize Game of Life
        let gameOfLife;
        document.addEventListener('DOMContentLoaded', function() {
            gameOfLife = new GameOfLife();
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            if (gameOfLife) {
                const newGridSize = gameOfLife.getGridSize();
                if (newGridSize !== gameOfLife.GRID_SIZE) {
                    gameOfLife.GRID_SIZE = newGridSize;
                    gameOfLife.initializeGrid();
                }
            }
        });
    </script>
</body>
</html>
